<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaç blok var?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --plate:#e3eaf5;
    --plate-dot:#c3cee2;
    --board:#fbfcfe;
    --ink:#1d2340;
    --ink-soft:#6b74a0;
    --sun:#f2b705;
    --leaf:#3d8b4f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Fredoka",system-ui,sans-serif;
    color:var(--ink);
    min-height:100vh;
    background-color:var(--plate);
    background-image:radial-gradient(var(--plate-dot) 1.6px, transparent 1.7px);
    background-size:26px 26px;
    display:flex;align-items:center;justify-content:center;
    padding:24px 16px;
  }
  .board{
    width:min(780px,100%);
    background:var(--board);
    border:1px solid #dbe2f0;
    border-radius:24px;
    box-shadow:0 20px 50px rgba(29,35,64,.14);
    padding:26px 24px 30px;
    text-align:center;
  }
  .eyebrow{display:none}
  h1{font-size:clamp(1.7rem,5vw,2.3rem);font-weight:700;letter-spacing:-.01em}

  .towers{
    display:flex;justify-content:center;align-items:flex-end;
    gap:clamp(16px,7vw,70px);
    margin:22px 0 4px;
    min-height:400px;
  }
  .tower{display:flex;flex-direction:column;align-items:center}
  .stack{display:flex;align-items:flex-end;justify-content:center;min-height:0}
  .stack svg{width:var(--brick-w,118px);height:auto;display:block;overflow:visible}
  @keyframes drop{from{transform:translateY(-30px);opacity:0}to{transform:none;opacity:1}}
  .brick{animation:drop .28s cubic-bezier(.2,1.4,.4,1) backwards}
  .hint-brick{animation:none;pointer-events:none}

  .label{
    margin-top:20px;min-width:80px;height:62px;
    display:grid;place-items:center;
    font-size:2rem;font-weight:700;
    background:#edf1f9;border-radius:14px;border-bottom:5px solid #d3dcee;
  }
  .label.ask{background:var(--sun);border-bottom-color:#bd8d00;color:#3a2c00}
  @keyframes pop{0%{transform:scale(.5)}70%{transform:scale(1.14)}100%{transform:scale(1)}}
  .label.revealed{background:var(--leaf);border-bottom-color:#2b6a3a;color:#fff;animation:pop .4s ease-out}

  .options{display:flex;justify-content:center;gap:clamp(12px,4vw,24px);margin-top:26px}
  .opt{
    font-family:inherit;font-size:1.8rem;font-weight:700;color:#fff;
    width:104px;height:68px;border:0;border-radius:14px;
    background:#b0332a;
    box-shadow:inset 0 3px 0 rgba(255,255,255,.28), inset 0 -10px 0 rgba(0,0,0,.2), 0 6px 0 rgba(0,0,0,.28);
    cursor:pointer;transition:transform .1s ease, box-shadow .1s ease;
  }
  .opt:hover:not(:disabled){transform:translateY(-3px)}
  .opt:active:not(:disabled){transform:translateY(4px);box-shadow:inset 0 3px 0 rgba(255,255,255,.28), inset 0 -10px 0 rgba(0,0,0,.2), 0 2px 0 rgba(0,0,0,.28)}
  .opt:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
  .opt.right{background:var(--leaf)}
  @keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
  .opt.wrong{opacity:.35;animation:shake .25s 2}
  .opt:disabled{cursor:default}

  .footer{
    display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
    gap:12px;margin-top:26px;
  }
  .status{font-weight:600;color:var(--ink-soft);text-align:center}
  .status.win{color:var(--leaf)}
  .next{
    font-family:inherit;font-size:1rem;font-weight:600;
    padding:12px 22px;border:0;border-radius:12px;
    background:var(--ink);color:#fff;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.3);
  }
  .footer .next{justify-self:end}
  .next:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.3)}
  .next:focus-visible{outline:3px solid var(--sun);outline-offset:3px}

  .ghost{
    font-family:inherit;font-size:.95rem;font-weight:600;
    display:inline-flex;align-items:center;gap:7px;
    padding:11px 16px;border:2px solid #d3dcee;border-radius:12px;
    background:transparent;color:var(--ink-soft);cursor:pointer;
  }
  .footer .ghost{justify-self:start}
  .ghost:hover{color:var(--ink);border-color:#b9c5de}
  .ghost:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

  .modal{
    position:fixed;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    margin:0;
    border:0;border-radius:20px;padding:26px;
    width:min(380px,calc(100% - 32px));
    max-height:calc(100vh - 32px);
    color:var(--ink);font-family:inherit;
    box-shadow:0 24px 60px rgba(29,35,64,.3);
  }
  .modal::backdrop{background:rgba(29,35,64,.45)}
  .modal h2{font-size:1.3rem;font-weight:700;margin-bottom:18px}
  .field{display:block;text-align:left;margin-bottom:16px}
  .field span{display:block;font-size:.92rem;font-weight:500;color:var(--ink-soft);margin-bottom:6px}
  .field input{
    font-family:inherit;font-size:1.25rem;font-weight:600;color:var(--ink);
    width:100%;padding:10px 12px;
    border:2px solid #d3dcee;border-radius:10px;background:#f7f9fd;
  }
  .field input:focus{outline:0;border-color:var(--ink)}
  .segmented{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#eef2f9;border-radius:12px;padding:5px}
  .segmented label{cursor:pointer}
  .segmented input{position:absolute;opacity:0;pointer-events:none}
  .segmented span{
    display:block;text-align:center;padding:9px 0;border-radius:8px;
    font-size:.95rem;font-weight:600;color:var(--ink-soft);
  }
  .segmented input:checked + span{background:var(--ink);color:#fff}
  .segmented input:focus-visible + span{outline:3px solid var(--ink);outline-offset:2px}
  .hint{font-size:.85rem;color:var(--ink-soft);min-height:1.2em;text-align:left}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}

  @media (max-width:560px){
    .board{padding:20px 14px 24px}
    .towers{min-height:300px;gap:10px}
    .opt{width:84px;height:60px;font-size:1.5rem}
    .footer{grid-template-columns:auto 1fr auto;gap:8px}
    .ghost{padding:11px 12px}
    .ghost svg{display:none}
    .next{padding:12px 14px}
    .status{font-size:.9rem}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="board">
  <h1>Kaç blok var?</h1>

  <div class="towers">
    <div class="tower">
      <div class="stack" id="stackA"></div>
      <div class="label" id="labelA"></div>
    </div>
    <div class="tower">
      <div class="stack" id="stackB"></div>
      <div class="label" id="labelB"></div>
    </div>
  </div>

  <div class="options" id="options"></div>

  <div class="footer">
    <button class="ghost" id="openSettings" aria-label="Ayarlar">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1.08 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
      Ayarlar
    </button>
    <p class="status" id="status">Hadi başlayalım.</p>
    <button class="next" id="next">Yeni soru</button>
  </div>
</main>

<dialog class="modal" id="settings">
  <h2>Ayarlar</h2>

  <div class="field">
    <span>Görünüm</span>
    <div class="segmented">
      <label><input type="radio" name="view" value="side"><span>Yandan</span></label>
      <label><input type="radio" name="view" value="iso"><span>İzometrik</span></label>
    </div>
  </div>

  <div class="field">
    <span>İpucu</span>
    <div class="segmented">
      <label><input type="radio" name="hintMode" value="off"><span>Kapalı</span></label>
      <label><input type="radio" name="hintMode" value="on"><span>Açık</span></label>
    </div>
  </div>

  <label class="field">
    <span>Kule yüksekliği / şıklardaki en büyük sayı</span>
    <input type="number" id="maxNum" min="3" max="12" step="1">
  </label>

  <label class="field">
    <span>İki kule arasındaki en fazla fark</span>
    <input type="number" id="maxDiff" min="1" max="11" step="1">
  </label>

  <p class="hint" id="hint"></p>

  <div class="modal-actions">
    <button class="ghost" id="closeSettings">Vazgeç</button>
    <button class="next" id="saveSettings">Kaydet</button>
  </div>
</dialog>

<script>
/* ---------- izometrik lego blok çizimi ----------
   Ölçüler gerçek LEGO standardından (mm) türetiliyor:
   2x2 blok tabanı 16x16 · blok yüksekliği 9.6 · stud çapı 4.8 (yarıçap 2.4)
   stud yüksekliği 1.7 · stud aralığı 8 (yani merkezler kenardan 4 mm içeride)  */
const MM = 6.25;            // 1 mm = 6.25 çizim birimi (16 mm -> 100)
const S  = 16   * MM;       // blok tabanı
const H  = 9.6  * MM;       // blok yüksekliği (studsuz)
const SR = 2.4  * MM;       // stud yarıçapı
const SH = 1.7  * MM;       // stud yüksekliği
const STUD_POS = [4 * MM, 12 * MM];   // stud merkezleri (8 mm aralık)
const KX = 0.866, KY = 0.5; // izometrik eksen katsayıları
const RX = SR * KX * Math.SQRT2;   // stud elipsi yatay yarıçap
const RY = SR * KY * Math.SQRT2;   // stud elipsi dikey yarıçap
const PAD = 8;

const iso = (u, v, dy = 0) => [KX * (u - v), KY * (u + v) + dy];
const pt = ([x, y]) => x.toFixed(2) + "," + y.toFixed(2);

function shade(hex, amt){
  const n = parseInt(hex.slice(1), 16);
  const t = amt < 0 ? 0 : 255, p = Math.abs(amt);
  const ch = c => Math.round((t - c) * p) + c;
  const r = ch(n >> 16), g = ch((n >> 8) & 255), b = ch(n & 255);
  return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}
function palette(base){
  return {
    top:   base,
    right: shade(base, -0.24),
    left:  shade(base, -0.44),
    studTop:  shade(base, 0.08),
    studSide: shade(base, -0.14),
    line:  shade(base, -0.66)
  };
}
const BASES = ["#b0332a", "#2f4f8f", "#e8a713", "#3d8b4f", "#d4691e", "#6b4a9e"];
const GHOST_LINE = "#98a4c2";

function studPath(u, v, dy, c){
  const [cx, cy] = iso(u, v, dy);
  const side = `M ${(cx-RX).toFixed(2)} ${(cy-SH).toFixed(2)}
                L ${(cx-RX).toFixed(2)} ${cy.toFixed(2)}
                A ${RX.toFixed(2)} ${RY.toFixed(2)} 0 0 0 ${(cx+RX).toFixed(2)} ${cy.toFixed(2)}
                L ${(cx+RX).toFixed(2)} ${(cy-SH).toFixed(2)} Z`;
  return `<path d="${side}" fill="${c.studSide}" stroke="${c.line}" stroke-width="1.6"/>
          <ellipse cx="${cx.toFixed(2)}" cy="${(cy-SH).toFixed(2)}" rx="${RX.toFixed(2)}" ry="${RY.toFixed(2)}"
                   fill="${c.studTop}" stroke="${c.line}" stroke-width="1.6"/>`;
}

function brick(dy, c, showStuds, delay){
  const T = iso(0, 0, dy), R = iso(S, 0, dy), F = iso(S, S, dy), L = iso(0, S, dy);
  const Rb = [R[0], R[1] + H], Fb = [F[0], F[1] + H], Lb = [L[0], L[1] + H];

  let studs = "";
  if (showStuds){
    const [n1, n2] = STUD_POS;                        // arkadan öne doğru çiz
    [[n1,n1],[n2,n1],[n1,n2],[n2,n2]].forEach(([u,v]) => studs += studPath(u, v, dy, c));
  }
  return `<g class="brick" style="animation-delay:${delay}ms">
    <polygon points="${pt(L)} ${pt(F)} ${pt(Fb)} ${pt(Lb)}" fill="${c.left}"/>
    <polygon points="${pt(R)} ${pt(F)} ${pt(Fb)} ${pt(Rb)}" fill="${c.right}"/>
    <polygon points="${pt(T)} ${pt(R)} ${pt(F)} ${pt(L)}" fill="${c.top}"/>
    ${studs}
    <g fill="none" stroke="${c.line}" stroke-width="2" stroke-linejoin="round">
      <polygon points="${pt(T)} ${pt(R)} ${pt(F)} ${pt(L)}"/>
      <polygon points="${pt(L)} ${pt(F)} ${pt(Fb)} ${pt(Lb)}"/>
      <polygon points="${pt(R)} ${pt(F)} ${pt(Fb)} ${pt(Rb)}"/>
    </g>
  </g>`;
}

function ghostStudPath(u, v, dy){
  const [cx, cy] = iso(u, v, dy);
  const side = `M ${(cx-RX).toFixed(2)} ${(cy-SH).toFixed(2)}
                L ${(cx-RX).toFixed(2)} ${cy.toFixed(2)}
                A ${RX.toFixed(2)} ${RY.toFixed(2)} 0 0 0 ${(cx+RX).toFixed(2)} ${cy.toFixed(2)}
                L ${(cx+RX).toFixed(2)} ${(cy-SH).toFixed(2)}`;
  return `<path d="${side}"/>
          <ellipse cx="${cx.toFixed(2)}" cy="${(cy-SH).toFixed(2)}" rx="${RX.toFixed(2)}" ry="${RY.toFixed(2)}"/>`;
}

function ghostBrickIso(dy, showStuds){
  const T = iso(0, 0, dy), R = iso(S, 0, dy), F = iso(S, S, dy), L = iso(0, S, dy);
  const Rb = [R[0], R[1] + H], Fb = [F[0], F[1] + H], Lb = [L[0], L[1] + H];
  let studs = "";
  if (showStuds){
    const [n1, n2] = STUD_POS;
    [[n1,n1],[n2,n1],[n1,n2],[n2,n2]].forEach(([u,v]) => studs += ghostStudPath(u, v, dy));
  }
  return `<g class="hint-brick" fill="none" stroke="${GHOST_LINE}" stroke-width="2.2"
             stroke-dasharray="7 6" stroke-linecap="round" stroke-linejoin="round" opacity=".95">
    <polygon points="${pt(T)} ${pt(R)} ${pt(F)} ${pt(L)}"/>
    <polygon points="${pt(L)} ${pt(F)} ${pt(Fb)} ${pt(Lb)}"/>
    <polygon points="${pt(R)} ${pt(F)} ${pt(Fb)} ${pt(Rb)}"/>
    ${studs}
  </g>`;
}

function towerIso(n, c, ghostCount = 0){
  const total = n + ghostCount;
  const w = 2 * KX * S, h = S + total * H;
  let body = "";
  for (let i = n - 1; i >= 0; i--){          // alttan üste: üstteki blok alttakini kapatır
    body += brick((ghostCount + i) * H, c, i === 0 && ghostCount === 0, (n - 1 - i) * 70);
  }
  for (let i = ghostCount - 1; i >= 0; i--){
    body += ghostBrickIso(i * H, i === 0);
  }
  const hintLabel = ghostCount ? `; ${ghostCount} ipucu bloğu` : "";
  return `<svg viewBox="${-w/2 - PAD} ${-PAD} ${w + 2*PAD} ${h + 2*PAD}" role="img" aria-label="${n} bloklu kule${hintLabel}">
    ${body}
  </svg>`;
}

/* ---------- yandan görünüm ----------
   2x2 blok yandan bakıldığında 16 mm eninde, 9.6 mm boyunda bir gövde ve
   arkadakileri tam kapatan iki stud olarak görünür. */
const SW = 4.8 * MM;        // stud eni (yandan)
let gradId = 0;

function brickSide(dy, c, id, showStuds, delay){
  let studs = "";
  if (showStuds){
    STUD_POS.forEach(x => {
      // alt kenarı gövdenin içine taşar, gövde üstüne çizilince gizlenir
      studs += `<rect x="${(x - SW/2).toFixed(2)}" y="${(dy - SH).toFixed(2)}"
                      width="${SW.toFixed(2)}" height="${(SH + 6).toFixed(2)}" rx="4"
                      fill="${c.studTop}" stroke="${c.line}" stroke-width="1.6"/>`;
    });
  }
  return `<g class="brick" style="animation-delay:${delay}ms">
    ${studs}
    <rect x="0" y="${dy.toFixed(2)}" width="${S}" height="${H}" rx="2.5"
          fill="url(#${id})" stroke="${c.line}" stroke-width="2"/>
  </g>`;
}

function ghostBrickSide(dy, showStuds){
  let studs = "";
  if (showStuds){
    STUD_POS.forEach(x => {
      studs += `<rect x="${(x - SW/2).toFixed(2)}" y="${(dy - SH).toFixed(2)}"
                      width="${SW.toFixed(2)}" height="${(SH + 6).toFixed(2)}" rx="4"/>`;
    });
  }
  return `<g class="hint-brick" fill="none" stroke="${GHOST_LINE}" stroke-width="2.2"
             stroke-dasharray="7 6" stroke-linecap="round" stroke-linejoin="round" opacity=".95">
    ${studs}
    <rect x="0" y="${dy.toFixed(2)}" width="${S}" height="${H}" rx="2.5"/>
  </g>`;
}

function towerSide(n, c, ghostCount = 0){
  const id = "g" + (++gradId);
  const total = n + ghostCount;
  let body = "";
  for (let i = n - 1; i >= 0; i--){
    body += brickSide((ghostCount + i) * H, c, id, i === 0 && ghostCount === 0, (n - 1 - i) * 70);
  }
  for (let i = ghostCount - 1; i >= 0; i--){
    body += ghostBrickSide(i * H, i === 0);
  }
  const hintLabel = ghostCount ? `; ${ghostCount} ipucu bloğu` : "";
  return `<svg viewBox="${-PAD} ${-SH - PAD} ${S + 2*PAD} ${total*H + SH + 2*PAD}"
               role="img" aria-label="${n} bloklu kule${hintLabel}">
    <defs>
      <linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="${c.studTop}"/>
        <stop offset="1" stop-color="${c.right}"/>
      </linearGradient>
    </defs>
    ${body}
  </svg>`;
}

function tower(n, base, ghostCount = 0){
  const c = palette(base);
  return settings.view === "iso" ? towerIso(n, c, ghostCount) : towerSide(n, c, ghostCount);
}

/* ---------- oyun ---------- */
const rnd = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
const pick = a => a[rnd(0, a.length - 1)];

const stackA = document.getElementById("stackA");
const stackB = document.getElementById("stackB");
const labelA = document.getElementById("labelA");
const labelB = document.getElementById("labelB");
const optionsEl = document.getElementById("options");
const statusEl = document.getElementById("status");

let round = null, score = 0;
const settings = { maxNum: 10, maxDiff: 2, view: "side", showHint: false };

// görünüme göre svg kutusunun ölçüleri
const viewBox = {
  iso:  n => [2 * KX * S + 2 * PAD, S + n * H + 2 * PAD],
  side: n => [S + 2 * PAD, n * H + SH + 2 * PAD]
};

/* blok genişliğini, olası en yüksek kule ekrana sığacak şekilde ayarla
   (iki kule de aynı ölçeği kullansın diye tek değişkenden besleniyor) */
function fitBricks(){
  const small = window.innerWidth < 560;
  const maxScale = (small ? 86 : 118) / (2 * KX * S);   // birim başına en fazla piksel
  const budget = small ? 300 : 440;                     // kuleye ayrılan yükseklik
  const [vbW, vbH] = viewBox[settings.view](settings.maxNum);
  const scale = Math.min(maxScale, budget / vbH);
  document.documentElement.style.setProperty("--brick-w", (vbW * scale).toFixed(1) + "px");
}
window.addEventListener("resize", fitBricks);

function newRound(){
  const { maxNum, maxDiff } = settings;
  const a = rnd(2, maxNum);
  let b;
  do { b = rnd(2, maxNum); } while (b === a || Math.abs(a - b) > maxDiff);

  const hidden = Math.random() < 0.5 ? "a" : "b";   // bazen soldaki, bazen sağdaki sorulur
  const correct = hidden === "a" ? a : b;
  const shown   = hidden === "a" ? b : a;

  // doğru cevap + komşusu kesin şık; komşu tavanı aşarsa bir eksiği alınır
  const neighbour = correct + 1 <= maxNum ? correct + 1 : correct - 1;
  const opts = [correct, neighbour];
  const pool = [];
  for (let v = 1; v <= maxNum; v++){
    if (!opts.includes(v) && v !== shown) pool.push(v);
  }
  opts.push(pick(pool));                            // üçüncüsü rastgele
  opts.sort(() => Math.random() - 0.5);

  round = { correct, solved: false };

  let c1 = pick(BASES), c2;
  do { c2 = pick(BASES); } while (c2 === c1);

  const diff = Math.abs(a - b);
  const ghostA = settings.showHint && a < b ? diff : 0;
  const ghostB = settings.showHint && b < a ? diff : 0;
  stackA.innerHTML = tower(a, c1, ghostA);
  stackB.innerHTML = tower(b, c2, ghostB);

  labelA.textContent = hidden === "a" ? "?" : a;
  labelB.textContent = hidden === "b" ? "?" : b;
  labelA.className = "label" + (hidden === "a" ? " ask" : "");
  labelB.className = "label" + (hidden === "b" ? " ask" : "");

  optionsEl.innerHTML = opts.map(v => `<button class="opt" data-v="${v}">${v}</button>`).join("");
  statusEl.textContent = "Doğru: " + score;
  statusEl.className = "status";
}

optionsEl.addEventListener("click", e => {
  const btn = e.target.closest(".opt");
  if (!btn || round.solved) return;

  if (Number(btn.dataset.v) === round.correct){
    round.solved = true;
    score++;
    btn.classList.add("right");
    optionsEl.querySelectorAll(".opt").forEach(b => b.disabled = true);
    const label = labelA.textContent === "?" ? labelA : labelB;
    label.textContent = round.correct;
    label.className = "label revealed";
    statusEl.textContent = "Doğru! " + round.correct + " blok var. Doğru: " + score;
    statusEl.className = "status win";
    setTimeout(newRound, 1800);
  } else {
    btn.classList.add("wrong");
    btn.disabled = true;
    statusEl.textContent = "Tekrar say bakalım.";
    statusEl.className = "status";
  }
});

document.getElementById("next").addEventListener("click", newRound);

/* ---------- ayarlar ---------- */
const dialog = document.getElementById("settings");
const maxNumInput = document.getElementById("maxNum");
const maxDiffInput = document.getElementById("maxDiff");
const hint = document.getElementById("hint");

document.getElementById("openSettings").addEventListener("click", () => {
  maxNumInput.value = settings.maxNum;
  maxDiffInput.value = settings.maxDiff;
  document.querySelector(`input[name="view"][value="${settings.view}"]`).checked = true;
  document.querySelector(`input[name="hintMode"][value="${settings.showHint ? "on" : "off"}"]`).checked = true;
  hint.textContent = "";
  dialog.showModal();
});
document.getElementById("closeSettings").addEventListener("click", () => dialog.close());

document.getElementById("saveSettings").addEventListener("click", () => {
  const n = parseInt(maxNumInput.value, 10);
  const d = parseInt(maxDiffInput.value, 10);

  if (!Number.isInteger(n) || n < 3 || n > 12){
    hint.textContent = "En büyük sayı 3 ile 12 arasında olmalı.";
    maxNumInput.focus();
    return;
  }
  if (!Number.isInteger(d) || d < 1 || d > n - 2){
    hint.textContent = "Fark 1 ile " + (n - 2) + " arasında olmalı.";
    maxDiffInput.focus();
    return;
  }
  settings.maxNum = n;
  settings.maxDiff = d;
  settings.view = document.querySelector('input[name="view"]:checked').value;
  settings.showHint = document.querySelector('input[name="hintMode"]:checked').value === "on";
  fitBricks();
  dialog.close();
  newRound();
});

fitBricks();
newRound();
</script>
</body>
</html>
